# 银龄伴诊 · CI
#
# 存在的理由：仓库里本来就有 609 条后端单测、34 条前端单测、ESLint 与 Prettier 配置，
# 但**没有任何入口会自动跑它们** —— 唯一的质量防线是「谁记得跑」。
# 本文件把那套已经存在的检查接上电。
#
# 后来新增的检查项（AGENTS.md §0.2 要求「新增检查项时同步改 workflow」）：
#   · 指标字典人读面↔机器面一致性（metric-dict job）—— V3.6 收口时新增
#   · 密钥体检（secrets job）—— 规则本体已收敛到 tools/check_secrets.py
#
# 为什么需要 service 容器：backend/src/test 下**有** @SpringBootTest（609 条里 270 条，
# 12 个类，明细见下面 backend job 的注释）—— 它们会拉起完整 Spring 上下文、Flyway 连库
# 建表灌种子，所以 CI 必须起 MySQL / Redis。本机全绿靠的是常驻服务，runner 上没有，必须显式起容器。
# 剩下的 339 条才是纯 Mockito 单测（没有用 @Testcontainers）。
# 别按「纯单测流水线、几十秒跑完」的预期去调 timeout。
# 计数口径 = surefire 的 `Tests run`（@ParameterizedTest 展开后），不是源码里的 @Test 方法数。
#
# 改本文件前先读 AGENTS.md §0.2：不要在这里引入 pom.xml / package.json 之外的依赖。

name: CI

# 锁 ubuntu-24.04 而非 ubuntu-latest：GitHub 已公告 2026-10-19 起 ubuntu-latest 迁移
# Ubuntu 26，迁移当天 latest 会突然换基线。锁死版本后，升级是一个显式的 PR 而不是
# 「某天早上突然红了」。要跟进的话把三处一起改成 ubuntu-26.04。
# 换镜像前先本地跑一遍：mvn -B verify / pnpm run lint:check && pnpm run test && pnpm run build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发：本地复现「CI 到底跑不跑得通」时用
  workflow_dispatch:

# 同一分支的新 push 会取消上一个未跑完的 run，省 Actions 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # 后端：编译 + 609 条测试 + JaCoCo 覆盖率报告
  # 跑 mvn verify 而非 mvn test：verify 才会触发 jacoco:report
  #
  # ⚠️ 这 609 条里**有 270 条是 @SpringBootTest**（12 个类：各 *AccessMatrixTest /
  #    ElderOwnershipMatrixTest / OrderFeeItemTest / FileUploadEndpointTest /
  #    JacksonDateTimeFormatTest），它们会拉起完整 Spring 上下文 → Flyway 连库
  #    建表灌种子。剩下 339 条是纯 Mockito 单测。
  #    口径：surefire `Tests run`（@ParameterizedTest 展开后）—— 源码里的 @Test
  #    方法数比它小（例如这 12 个类合计只有 192 个方法）。
  #    本机全绿是因为有常驻 MySQL/Redis；GitHub runner 上没有，所以必须起 service 容器。
  #
  # 不需要改任何 yml：application-dev.yml 的连接串全走环境变量
  # （MYSQL_USERNAME / MYSQL_PASSWORD / REDIS_HOST / REDIS_PORT），
  # 测试也没声明 @ActiveProfiles —— 靠下面这些 env 注入即可。
  # ------------------------------------------------------------------ #
  backend:
    name: 后端 · mvn verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          # 占位库口令，只存在于 runner 的临时容器里（AGENTS.md §0.2：明文口令不入库）
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: nianglin
        ports:
          - 3306:3306
        # options 原样透传给 docker create，参数名必须是 docker 自己的：
        #   --health-cmd / --health-interval / --health-timeout / --health-retries
        #   / --health-start-period
        # ⚠️ 这里踩过三个坑（2026-10-02 连修三轮才对）：
        #  a) 用 `>` 折叠标量时**不能写行内注释** —— YAML 不把 `#` 当注释，
        #     中文说明会被拼进 docker 命令行 → exit 125。
        #  b) --health-cmd 的值含空格要用转义引号 \"…\"，否则引号被剥掉后
        #     `mysqladmin ping` 被拆成两个 argv，`ping` 变成位置参数 → Usage。
        #  c) **参数名写错一个就整条 Usage**：我先前写的是 `--start-period`，
        #     docker 根本没有这个 flag（正确的是 --health-start-period），
        #     于是无论前两处怎么修都照样 exit 125。
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 等 MySQL 真正能连上 —— health-cmd 通过不等于 JDBC 可用
      - name: 等数据库就绪
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              echo "MySQL 端口已就绪（第 $i 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL 60s 内未就绪"
          exit 1

      # 连接信息只从 service 容器取，不写进任何入库文件（AGENTS.md §0.2）
      - name: 编译 + 测试 + 覆盖率
        run: mvn -B verify
        env:
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci_only_password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # 前端：ESLint（--max-warnings 0，警告即失败）+ Vitest + 生产构建
  # 三步都不可省：lint 挡风格、test 挡逻辑、build 挡「能过测试但打不出包」
  # ------------------------------------------------------------------ #
  frontend:
    name: 前端 · lint + vitest + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # ⚠️ 顺序不能颠倒：actions/setup-node 的 cache: 'pnpm' 需要 pnpm 已在 PATH 上
      #    才能算 store 指纹。少了这一步，本 job 会在「装依赖」报
      #    `Unable to locate executable file: pnpm`（2026-10-02 首跑踩过）。
      #
      # ⚠️ version 必须**显式写**：本 job 设了 defaults.working-directory: frontend，
      #    而 pnpm/action-setup 读 package.json 的 packageManager 字段时是从
      #    workflow 根目录找的，找不到就报 `No pnpm version is specified`。
      #    9.15.9 与 pnpm-lock.yaml 的 lockfileVersion 9.0 匹配。
      - name: 装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # ⚠️ Node 必须是 **24**，不能是 20：
      #    jsdom 30 → undici 的 CacheStorage 会调 `webidl.util.markAsUncloneable`，
      #    该 API 自 Node v22.10.0 起才有（node:worker_threads）。Node 20 上没有，
      #    每个 forks worker 启动即抛 `markAsUncloneable is not a function`，
      #    报成 `[vitest-pool]: Failed to start forks worker`。
      #    本机 Node 24 所以一直复现不出来 —— 这也是「CI 与本地版本必须对齐」的典型。
      - name: 装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 用 lint:check 而非 lint：后者带 --fix，会在 CI 里静默改文件
      - name: ESLint
        run: pnpm run lint:check

      # ⚠️ 必须限制 worker：vitest 5 默认 pool=forks，maxWorkers 取「可用 CPU 数」，
      #    每个 worker 都是独立 node 进程、各带一份 jsdom 与完整模块图。
      #    标准 runner 只有 2 vCPU / 7GB，4 个 fork 同时起来会 OOM，
      #    报 `[vitest-pool]: Failed to start forks worker`。
      #    本地 Windows 机器核多内存大，所以只在本地跑永远复现不出来。
      #    注：vitest 5 CLI 只有 --maxWorkers / --no-file-parallelism，没有 --minWorkers
      - name: Vitest
        run: pnpm exec vitest run --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=3072

      - name: 生产构建
        run: pnpm run build

  # ------------------------------------------------------------------ #
  # 密钥体检
  #
  # 为什么单独一个 job：AGENTS.md §0.1 写死了「本地存储禁止写入完整手机号 /
  # 身份证号」，§0.2 要求示例数据一律用占位串。仓库里还有一条同级红线 ——
  # tools/e2e 的产出**可能含真实签发的 JWT**（见 .gitignore 里 reports/ 的注释）。
  # 这些都不是编译器和 linter 能管的事，只能靠扫。
  # ------------------------------------------------------------------ #
  secrets:
    name: 密钥体检
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 保留完整历史，后续要扫「曾经提交过」时不用再改 workflow

      # ⚠️ **规则本体在 `tools/check_secrets.py`，不要在这里再抄一份。**
      # 这四条曾经内联在本文件里，结果本地自查脚本与 CI 各有一份 ——
      # 抄两份就出现「本地脚本的 Windows 路径分隔符让白名单永远不生效」这种偏差，
      # 而本 job 绿着、本地红着，谁也不知道该信谁。
      # 改规则请改脚本，本 job 只负责调用；脚本与本 job 的等价性由
      # 「植入一个已知会命中的样本，两边都必须变红」来保证。
      - name: 扫 JWT / 明文口令 / 真实手机号 / 真实身份证号
        run: python3 tools/check_secrets.py

  # ------------------------------------------------------------------ #
  # AI 助手服务（V3.7 · M14）
  #
  # 家属智能助手的 Python 侧（ai-service/）。核心断言**不依赖 LLM 与网络**：
  # 意图分类 / 检索 / 护栏 / 降级路径都走「不接模型」那条路，所以这个 job
  # 在 runner 上必然可重复。
  #
  # ⚠️ 依赖清单是**经人工逐项批准**的（见 ADR-0020 与 requirements.txt 头部注释），
  #    不要在这里另加东西 —— CI 装什么，仓库就承诺什么。
  # ------------------------------------------------------------------ #
  ai-service:
    name: AI 助手 · pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7

      # ⚠️ cache-dependency-path 必须是**相对仓库根**的路径：
      #    本 job 设了 defaults.working-directory: ai-service，
      #    而 setup-python 读 lockfile 指纹时是从 workflow 根目录找的。
      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: 装依赖
        run: pip install -r requirements.txt

      # 不带任何模型配置 → 全部走降级路径，答案确定
      - name: 跑测试
        run: pytest tests -q

  # ------------------------------------------------------------------ #
  # 指标字典一致性
  #
  # 人读面（docs/spec/metric-dictionary.md）与机器面
  # （backend/src/main/resources/metrics/metric-dictionary.yml）必须一致 ——
  # 两边对不上就是**口径漂移本身**。
  #
  # 为什么单开一个 job：这条检查不产出构建物，只回答「文档有没有抄错口径」。
  # V3.6 收口时真实漂移过一次 —— 人读面写 `visit_time`、
  # 机器面与 SQL 都是 `create_time`，而当时只比 key 集合，漂移就溜过去了。
  # ------------------------------------------------------------------ #
  metric-dict:
    name: 指标字典 · 人读面↔机器面
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # ⚠️ 脚本只用标准库（不 import yaml）：CI 没有承诺装 PyYAML，
      # 而本文件顶部明写「不要引入 pom.xml / package.json 之外的依赖」。
      - name: 校验人读面与机器面一致
        run: python3 tools/check_metric_dict_parity.py

