# 银龄伴诊 · CI
#
# 存在的理由：仓库里本来就有 610 条后端单测、34 条前端单测、ESLint 与 Prettier 配置，
# 但**没有任何入口会自动跑它们** —— 唯一的质量防线是「谁记得跑」。
# 本文件把那套已经存在的检查接上电，不新增任何检查项。
#
# 为什么跑得起来：backend/src/test 下**没有** @SpringBootTest / @Testcontainers，
# 全是纯 Mockito 单测，因此 CI 不需要 MySQL / Redis / Redis 端口。
# 这也是它能在 GitHub Actions 上 26 秒跑完的原因。
#
# 改本文件前先读 AGENTS.md §0.2：不要在这里引入 pom.xml / package.json 之外的依赖。

name: CI

# 锁 ubuntu-24.04 而非 ubuntu-latest：GitHub 已公告 2026-10-19 起 ubuntu-latest 迁移
# Ubuntu 26，迁移当天 latest 会突然换基线。锁死版本后，升级是一个显式的 PR 而不是
# 「某天早上突然红了」。要跟进的话把三处一起改成 ubuntu-26.04。
# 换镜像前先本地跑一遍：mvn -B verify / pnpm run lint:check && pnpm run test && pnpm run build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发：本地复现「CI 到底跑不跑得通」时用
  workflow_dispatch:

# 同一分支的新 push 会取消上一个未跑完的 run，省 Actions 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # 后端：编译 + 610 条测试 + JaCoCo 覆盖率报告
  # 跑 mvn verify 而非 mvn test：verify 才会触发 jacoco:report
  #
  # ⚠️ 这 610 条里**有 191 条是 @SpringBootTest**（12 个类：各 *AccessMatrixTest /
  #    ElderOwnershipMatrixTest / OrderFeeItemTest / FileUploadEndpointTest /
  #    JacksonDateTimeFormatTest），它们会拉起完整 Spring 上下文 → Flyway 连库
  #    建表灌种子。剩下 419 条是纯 Mockito 单测。
  #    本机全绿是因为有常驻 MySQL/Redis；GitHub runner 上没有，所以必须起 service 容器。
  #
  # 不需要改任何 yml：application-dev.yml 的连接串全走环境变量
  # （MYSQL_USERNAME / MYSQL_PASSWORD / REDIS_HOST / REDIS_PORT），
  # 测试也没声明 @ActiveProfiles —— 靠下面这些 env 注入即可。
  # ------------------------------------------------------------------ #
  backend:
    name: 后端 · mvn verify
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          # 占位库口令，只存在于 runner 的临时容器里（AGENTS.md §0.2：明文口令不入库）
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: nianglin
        ports:
          - 3306:3306
        # ⚠️ options 里**不能写行内注释**：YAML 的 `>` 折叠标量会把 `# …` 原样
        #    当成值的一部分传下去，docker create 收到一个不认识的参数直接 exit 1。
        #    要写说明就放在本行外面。
        # MySQL 8 首次初始化约 20-30s，wait-for-services 不会看 health 参数
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci_only_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: 装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 等 MySQL 真正能连上 —— health-cmd 通过不等于 JDBC 可用
      - name: 等数据库就绪
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              echo "MySQL 端口已就绪（第 $i 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL 60s 内未就绪"
          exit 1

      # 连接信息只从 service 容器取，不写进任何入库文件（AGENTS.md §0.2）
      - name: 编译 + 测试 + 覆盖率
        run: mvn -B verify
        env:
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ci_only_password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # 前端：ESLint（--max-warnings 0，警告即失败）+ Vitest + 生产构建
  # 三步都不可省：lint 挡风格、test 挡逻辑、build 挡「能过测试但打不出包」
  # ------------------------------------------------------------------ #
  frontend:
    name: 前端 · lint + vitest + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # ⚠️ 顺序不能颠倒：actions/setup-node 的 cache: 'pnpm' 需要 pnpm 已在 PATH 上
      #    才能算 store 指纹。少了这一步，本 job 会在「装依赖」报
      #    `Unable to locate executable file: pnpm`（2026-10-02 首跑踩过）。
      #
      # ⚠️ version 必须**显式写**：本 job 设了 defaults.working-directory: frontend，
      #    而 pnpm/action-setup 读 package.json 的 packageManager 字段时是从
      #    workflow 根目录找的，找不到就报 `No pnpm version is specified`。
      #    9.15.9 与 pnpm-lock.yaml 的 lockfileVersion 9.0 匹配。
      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: 装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 用 lint:check 而非 lint：后者带 --fix，会在 CI 里静默改文件
      - name: ESLint
        run: pnpm run lint:check

      # ⚠️ 必须限制 worker：vitest 5 默认 pool=forks，maxWorkers 取「可用 CPU 数」，
      #    每个 worker 都是独立 node 进程、各带一份 jsdom 与完整模块图。
      #    标准 runner 只有 2 vCPU / 7GB，4 个 fork 同时起来会 OOM，
      #    报 `[vitest-pool]: Failed to start forks worker`。
      #    本地 Windows 机器核多内存大，所以只在本地跑永远复现不出来。
      #    注：vitest 5 CLI 只有 --maxWorkers / --no-file-parallelism，没有 --minWorkers
      - name: Vitest
        run: pnpm exec vitest run --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=3072

      - name: 生产构建
        run: pnpm run build

  # ------------------------------------------------------------------ #
  # 密钥体检
  #
  # 为什么单独一个 job：AGENTS.md §0.1 写死了「本地存储禁止写入完整手机号 /
  # 身份证号」，§0.2 要求示例数据一律用占位串。仓库里还有一条同级红线 ——
  # tools/e2e 的产出**可能含真实签发的 JWT**（见 .gitignore 里 reports/ 的注释）。
  # 这些都不是编译器和 linter 能管的事，只能靠扫。
  # ------------------------------------------------------------------ #
  secrets:
    name: 密钥体检
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要历史才能扫「曾经提交过」

      - name: 扫 JWT / 明文口令 / 真实手机号
        run: |
          set -euo pipefail
          # 只扫入库范围：汇报物料（presentation/ voiceover/）已 gitignore，不该进扫描
          fail=0

          # ① 真实 JWT（eyJ 开头的 base64 头）
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}' -- . ; then
            echo "::error::发现疑似真实 JWT"
            fail=1
          fi

          # ② 明文口令赋值 —— 排除四类**已知安全**的形态，否则本 job 永远红：
          #    a) 占位串与变量引用：CHANGE_ME / ${VAR} / your-xxx / os.environ["X"]
          #    b) @Schema(example=...) 与 @Pattern 的文档示例 —— 那是给人看的契约
          #    c) 单测夹具里的固定口令（AuthServiceTest 等），断言要用，不能改
          #    d) 种子密钥生成器 GenSeedSecrets 的本地默认口令，其值由环境变量覆盖
          #    真正要抓的是 application-*.yml 里的硬编码
          if git grep -nE '(password|passwd|secret)[[:space:]]*[=:][[:space:]]*["'"'"'][^"'"'"']{6,}' -- . \
             | grep -vE 'CHANGE_ME|your-|your_|占位|示例|dummy|example|\$\{|os\.environ|getenv|__tests__|/test/|GenSeedSecrets' ; then
            echo "::error::发现疑似明文口令（生产代码与配置中不得硬编码）"
            fail=1
          fi

          # ③ 真实手机号 —— 白名单放过种子数据、E2E 夹具与文档示例的固定号段：
          #    1380000(AGENTS.md §0.2 占位串) / 138001 / 137001 / 138123 / 139001 /
          #    139111 / 138999 / 139000(E2E 夹具) / 135000(E2E 夹具) / xxxx 掩码
          if git grep -nE '\b1[3-9][0-9]{9}\b' -- . \
             | grep -vE '1380000|138001|137001|138123|139001|139111|138999|139000|135000|xxxx' ; then
            echo "::error::发现疑似真实手机号（示例数据请用 13800000000）"
            fail=1
          fi

          # ④ 真实身份证号 —— 本仓库的示例号段是固定的三组，全部白名单：
          #    110101…  AGENTS.md §0.2 规定的占位串
          #    460101…  DTO 的 @Schema example、单测夹具、e2e 夹具共用的固定示例
          #    4601xx / 4403xx  GenSeedSecrets 每次随机生成的假号（不固定、不可用）
          #    真正要抓的是这三组之外的号 —— 那才是可能来自真实用户的
          if git grep -nE '\b[1-9][0-9]{5}(19|20)[0-9]{2}(0[1-9]|1[0-2])[0-9]{2}[0-9]{3}[0-9Xx]\b' -- . \
             | grep -vE '11010119|46010119|4601011948|46[0-9]{4}(19|20)[0-9]{2}' ; then
            echo "::error::发现疑似身份证号（示例数据请用 110101199001010001）"
            fail=1
          fi

          exit $fail

