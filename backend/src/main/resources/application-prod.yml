# ==========================================================================
# 生产环境配置（W15 部署阶段使用）
# 所有敏感项一律走环境变量，禁止硬编码
# ==========================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nianglin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 10000
      # 生产环境连不上库直接失败，避免带病启动
      initialization-fail-timeout: 1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 生产 Redis 必须有口令：不再给空串兜底，未注入 REDIS_PASSWORD 即启动失败
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  # 生产环境由 Flyway 管理表结构
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8
    validate-on-migrate: true

# 生产环境关闭接口文档与 SQL 日志
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
  production: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    org.company.nianglin: info

# --------------------------------------------------------------------------
# CORS：生产必须显式指定真实前端域名（逗号分隔多个），由环境变量
# CORS_ALLOWED_ORIGINS 注入。这里给出一个占位域名而非本机白名单，
# 目的是「fail-closed」：占位域名不会命中任何真实来源，未正确配置时表现为
# 跨域全拒，绝不会静默回落到本机 localhost 放行。
#
# 与 SecurityConfig / WebMvcConfig 的 @Value 兜底值不同：兜底值（CorsConstants）只在
# 「既无配置、也无环境变量」时生效，生产正常不会走到，两处引用同一常量保持一致。
# --------------------------------------------------------------------------
nianglin:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nianglin.example.com}
