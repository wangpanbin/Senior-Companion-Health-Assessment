# 指标字典 · 机器面
#
# 人读面：docs/spec/metric-dictionary.md（两者必须同步，测试只校验本文件）
# 加载器：org.company.nianglin.util.MetricDictionary
# 校验：backend/src/test/java/org/company/nianglin/util/MetricDictionaryTest.java
#
# 规则（AGENTS.md §2.7 错误码纪律的同源约束）：
#   1. 任何指标必须先在这里登记，才允许出现在 VO 里；
#   2. 每条指标必须写全五要素：统计范围 / 统计时间 / 数据来源 / 计算公式 / 名称；
#   3. bindings 指向「哪个 VO 的哪个字段」，测试会双向核对；
#   4. 口径变更 = 改公式 + 升 caliberVersion + 在人读面变更记录留一行，
#      **不改写历史数据**；
#   5. vos 段声明每个 VO 的字段构成：出现在 bindings 里的是指标，
#      出现在 structural 里的是结构字段 —— 两边都没有的字段会让测试变红。

version: 5
updatedAt: "2026-10-20"

metrics:
  # ==================== 就医 ====================
  - key: elder.visit.order_count
    name: 就医次数
    scope: 单个老人档案在统计区间内「已完成」的陪诊订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(elder_id, status, visit_time)
    formula: "COUNT(status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Visit
        field: orderCount

  - key: elder.visit.companion_count
    name: 陪诊人数
    scope: 统计区间内服务过这位老人的陪诊员人数（去重）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(elder_id, status, companion_id)
    formula: "COUNT(DISTINCT companion_id WHERE status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Visit
        field: companionCount

  - key: elder.summary.recent_visit_count
    name: 近期就医次数
    scope: 家庭健康协同首页里，该老人在统计区间内已完成的陪诊订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(elder_id, status, visit_time)
    formula: "COUNT(status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
    bindings:
      - vo: FamilyHealthSummaryVO
        field: recentVisitCount

  # ==================== 用药 ====================
  - key: elder.medication.total
    name: 区间内用药任务总数
    scope: 单个老人档案在统计区间内的服药任务总数（三桶的分母）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(*)"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Medication
        field: total

  - key: elder.medication.taken
    name: 已服数量
    scope: 统计区间内「已服且从未漏过」的服药任务数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(bucket = 'TAKEN')，bucket 由 MedicationBucket.of(status, was_missed) 唯一裁定"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Medication
        field: taken

  - key: elder.medication.missed
    name: 漏服数量
    scope: 统计区间内漏服的服药任务数（含漏服后补记的记录）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(bucket = 'MISSED')，即 status = 'MISSED' 或 was_missed = 1"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Medication
        field: missed

  - key: elder.medication.pending
    name: 待服数量
    scope: 统计区间内尚未确认的服药任务数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(elder_id, plan_date, status)
    formula: "COUNT(bucket = 'PENDING')，即 status = 'PENDING' 且从未漏过"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Medication
        field: pending

  - key: elder.medication.completion_rate
    name: 用药完成率
    scope: 统计区间内的服药完成率；分母含漏服与待服
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "taken / total；total = 0 时返回 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: ElderHealthOverviewVO$Medication
        field: completionRate

  - key: elder.today.total
    name: 今日用药任务总数
    scope: 该老人今日的服药任务总数
    period: 当天（按 plan_date 精确匹配，不随统计区间浮动）
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(*)"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
      - "GET /api/family/elder/{elderId}/health/overview"
      - "GET /api/elder/health/overview"
    bindings:
      - vo: MedicationTodayVO
        field: total

  - key: elder.today.taken
    name: 今日已服数量
    scope: 该老人今日已服且从未漏过的服药任务数
    period: 当天
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(bucket = 'TAKEN')"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
      - "GET /api/family/elder/{elderId}/health/overview"
      - "GET /api/elder/health/overview"
    bindings:
      - vo: MedicationTodayVO
        field: taken

  - key: elder.today.pending
    name: 今日待服数量
    scope: 该老人今日尚未确认的服药任务数
    period: 当天
    source: medication_task(elder_id, plan_date, status)
    formula: "COUNT(bucket = 'PENDING')"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
      - "GET /api/family/elder/{elderId}/health/overview"
      - "GET /api/elder/health/overview"
    bindings:
      - vo: MedicationTodayVO
        field: pending

  - key: elder.today.missed
    name: 今日漏服数量
    scope: 该老人今日漏服的服药任务数（含漏服后补记）
    period: 当天
    source: medication_task(elder_id, plan_date, status, was_missed)
    formula: "COUNT(bucket = 'MISSED')，即 status = 'MISSED' 或 was_missed = 1"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
      - "GET /api/family/elder/{elderId}/health/overview"
      - "GET /api/elder/health/overview"
    bindings:
      - vo: MedicationTodayVO
        field: missed

  # ==================== 待处理 ====================
  - key: elder.summary.pending_item_count
    name: 待处理事项条数
    scope: 该老人当前需要家属处理的事项<b>类别</b>数（不是事项条数）
    period: 当前状态（不受统计区间影响）
    source: medication_task(status) + companion_order(status, fulfillment_risk)
    formula: "COUNT(满足任一待处理判定的类别)：今日待服 / 待接单订单 / 待评价订单 / 高风险订单"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/health/summary"
    bindings:
      - vo: FamilyHealthSummaryVO
        field: pendingItemCount

  - key: elder.pending_item.count
    name: 单类待处理事项数量
    scope: 某<b>一类</b>待处理事项的数量（同一时刻只出现一条该类事项）
    period: 当前状态（不受统计区间影响）
    source: medication_task(status) 或 companion_order(status, fulfillment_risk)，按 type 判定
    formula: "按 type 分别统计：MEDICATION_PENDING 今日待服 / ORDER_WAITING 待接单 / ORDER_TO_REVIEW 待评价 / FULFILLMENT_RISK 高风险"
    caliberVersion: 1
    endpoints:
      - "GET /api/family/elder/{elderId}/health/overview"
    bindings:
      - vo: HealthPendingItemVO
        field: count

  # ==================== 陪诊员工作台（V3.3） ====================
  # 区间口径：统计区间默认 30 天、最多 366 天、闭区间；
  # 累计口径：历史累计，不随统计区间浮动。
  # ⚠️ 区间口径的订单一律按 visit_time 过滤（与 V3.2 家属端 elder.visit.order_count 同一时间字段）。
  - key: companion.workbench.completed_order_count
    name: 区间完成单数
    scope: 当前陪诊员在统计区间内「已完成」的陪诊订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, status, visit_time)
    formula: "COUNT(status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me"
    bindings:
      - vo: CompanionWorkbenchOverviewVO
        field: completedOrderCount

  - key: companion.workbench.service_duration
    name: 区间服务时长（分钟）
    scope: 当前陪诊员在统计区间内「已完成」订单的服务时长合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, status, start_time, finish_time)
    formula: "SUM(TIMESTAMPDIFF(MINUTE, start_time, finish_time))，仅 start_time 与 finish_time 均非空"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me"
    bindings:
      - vo: CompanionWorkbenchOverviewVO
        field: serviceDurationMinutes

  - key: companion.workbench.completion_rate
    name: 区间完成率
    scope: 当前陪诊员在统计区间内的完成率；注意 V3.6 干预效果对比端点（/api/admin/operations/effect）按平台口径给出同公式值（管理端视角），陪诊员个人口径仍由 V3.3 工作台按陪诊员过滤后计算
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, status, visit_time)
    formula: "(COMPLETED + REVIEWED) / (COMPLETED + REVIEWED + CANCELLED)，拒单不计入分母"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/statistics/companion/me"
    bindings:
      - vo: CompanionWorkbenchOverviewVO
        field: completionRate

  - key: companion.workbench.period_income
    name: 区间收入
    scope: 当前陪诊员在统计区间内「已完成」订单的结算金额合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, status, fee, actual_fee, visit_time)
    formula: "SUM(COALESCE(actual_fee, fee))，仅 COMPLETED + REVIEWED"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me"
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionWorkbenchOverviewVO
        field: periodIncome

  - key: companion.average_score
    name: 平均评分
    scope: 当前陪诊员的历史累计平均评分（评价聚合后的冗余字段，不重算）
    period: 历史累计（不随统计区间浮动）
    source: companion_profile(score, user_id)
    formula: "companion_profile.score（由 ReviewServiceImpl#refreshCompanionScore 在评价提交时于事务内刷新）"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me"
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionWorkbenchOverviewVO
        field: averageScore
      - vo: CompanionServiceProfileVO
        field: averageScore

  - key: companion.trend.series_value
    name: 趋势序列值
    scope: 当前陪诊员在统计区间内按天/周/月分桶的指标序列
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(visit_time, status, fee, actual_fee) + order_review(create_time, score)
    formula: "按 dimension 取值：ORDER=区间完成单数 / INCOME=区间收入 / RATING=区间内有效评价的平均分（按条数加权）"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/trend"
    bindings:
      - vo: CompanionTrendVO$Series
        field: data

  - key: companion.profile.total_completed_order_count
    name: 累计完成单数
    scope: 当前陪诊员历史累计「已完成」的陪诊订单数
    period: 历史累计（不随统计区间浮动）
    source: companion_order(companion_id, status)
    formula: "COUNT(status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionServiceProfileVO
        field: totalCompletedOrderCount

  - key: companion.profile.total_served_elder_count
    name: 累计服务老人数
    scope: 当前陪诊员历史累计服务过的不同老人数（去重）
    period: 历史累计（不随统计区间浮动）
    source: companion_order(companion_id, elder_id, status)
    formula: "COUNT(DISTINCT elder_id WHERE status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionServiceProfileVO
        field: totalServedElderCount

  - key: companion.profile.punctuality_rate
    name: 累计准时率
    scope: 当前陪诊员历史累计的准时到院比例
    period: 历史累计（不随统计区间浮动）
    source: order_checkin(node, checkin_time) JOIN companion_order(visit_time, accept_time)
    formula: "分子=存在 ARRIVE 打卡且 checkin_time <= visit_time 的订单数；分母=已接单订单数（accept_time 非空）；无 ARRIVE 打卡视为不准时"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionServiceProfileVO
        field: punctualityRate

  - key: companion.profile.total_completion_rate
    name: 累计完成率
    scope: 当前陪诊员历史累计的完成率
    period: 历史累计（不随统计区间浮动）
    source: companion_order(companion_id, status)
    formula: "(COMPLETED + REVIEWED) / (COMPLETED + REVIEWED + CANCELLED)，拒单不计入分母"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionServiceProfileVO
        field: totalCompletionRate

  - key: companion.profile.total_service_duration
    name: 累计服务时长（分钟）
    scope: 当前陪诊员历史累计「已完成」订单的服务时长合计
    period: 历史累计（不随统计区间浮动）
    source: companion_order(companion_id, status, start_time, finish_time)
    formula: "SUM(TIMESTAMPDIFF(MINUTE, start_time, finish_time))，仅 start_time 与 finish_time 均非空"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionServiceProfileVO
        field: totalServiceDurationMinutes

  - key: companion.profile.expertise_order_count
    name: 擅长服务单数
    scope: 当前陪诊员在某个科室上「已完成」的订单数（擅长服务标签的取值来源）
    period: 历史累计（不随统计区间浮动）
    source: companion_order(companion_id, department, status)
    formula: "COUNT(*) GROUP BY department，样本 < 5 单的科室不展示，最多展示 TOP 5"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/profile"
    bindings:
      - vo: CompanionExpertiseVO
        field: orderCount

  - key: companion.income.order_amount
    name: 区间订单金额
    scope: 当前陪诊员在统计区间内「已完成」订单的合同服务费合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, fee, status, visit_time)
    formula: "SUM(fee)，仅 COMPLETED + REVIEWED"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: orderAmount

  - key: companion.income.actual_income
    name: 区间实际收入
    scope: 当前陪诊员在统计区间内「已完成」订单的结算金额合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, fee, actual_fee, status, visit_time)
    formula: "SUM(COALESCE(actual_fee, fee))，仅 COMPLETED + REVIEWED"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: actualIncome

  - key: companion.income.unsettled_amount
    name: 区间待结算金额
    scope: 当前陪诊员在统计区间内「已完成」且尚未线下结算的金额合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, fee, actual_fee, payment_status, status, visit_time)
    formula: "SUM(COALESCE(actual_fee, fee)) WHERE payment_status = 'UNPAID'"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: unsettledAmount

  - key: companion.income.settled_amount
    name: 区间已结算金额
    scope: 当前陪诊员在统计区间内「已完成」且已完成线下结算的金额合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, fee, actual_fee, payment_status, status, visit_time)
    formula: "SUM(COALESCE(actual_fee, fee)) WHERE payment_status = 'SETTLED'"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: settledAmount

  - key: companion.income.advance_total
    name: 区间代垫合计
    scope: 当前陪诊员在统计区间内「已完成」订单上代垫的费用合计（家属需还给陪诊员）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: order_fee_item(item_type, amount) JOIN companion_order(companion_id, status, visit_time)
    formula: "SUM(amount) WHERE item_type = 'ADVANCE'"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: advanceTotal

  - key: companion.income.service_total
    name: 区间服务费合计
    scope: 当前陪诊员在统计区间内「已完成」订单上记账的服务费合计
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: order_fee_item(item_type, amount) JOIN companion_order(companion_id, status, visit_time)
    formula: "SUM(amount) WHERE item_type = 'SERVICE'"
    caliberVersion: 1
    endpoints:
      - "GET /api/statistics/companion/me/income"
    bindings:
      - vo: CompanionIncomeVO
        field: serviceTotal

  # ==================== 智能调度匹配（V3.4） ====================
  # 维度得分是「0–1 的原始分 × 100 后的整数」，加权总分 = Σ(维度分 × 权重)。
  # ⚠️ 权重配置化于 nianglin.matching.*.weight，且启动期校验权重之和 = 1。
  - key: matching.total_score
    name: 匹配总分
    scope: 候选陪诊员对某个订单的加权匹配总分（五维加权）
    period: 单次匹配（订单与候选人的配对，无时间区间）
    source: 匹配规则引擎（companion_profile / companion_order / order_checkin / companion_available_slot）
    formula: "Σ(维度分 × 权重) × 100，权重：区域 30% / 时间 25% / 距离 20% / 服务能力 15% / 评分 10%（配置化于 nianglin.matching.*.weight）"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: totalScore

  - key: matching.region_score
    name: 区域维度得分
    scope: 候选陪诊员与订单的服务区域匹配程度
    period: 单次匹配
    source: companion_profile(service_region_code, service_area) + companion_order(service_region_code, address)
    formula: "区域码相等 = 100；同市不同区 = 50；跨市 = 0；缺区域码时回退自由文本包含式并降级标注"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: regionScore

  - key: matching.time_score
    name: 时间维度得分
    scope: 订单就诊时间与候选陪诊员可服务时段的重合程度
    period: 单次匹配
    source: companion_available_slot(weekday, start_time, end_time) + companion_profile(available_time)
    formula: "就诊时间落在可服务时段内 = 100；同日但不在时段内 = 50；其它 = 0；无可服务时段时记 0 并降级标注"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: timeScore

  - key: matching.distance_score
    name: 距离维度得分
    scope: 候选陪诊员与订单地址的直线距离匹配程度
    period: 单次匹配
    source: companion_profile(longitude, latitude) + companion_order(longitude, latitude)
    formula: "(1 - Haversine距离 / 满量程) × 100，满量程 nianglin.matching.distance-max-meters（默认 30000 米）；陪诊员无坐标时记 0 并标注「未填写坐标」，绝不按 (0,0) 推断"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: distanceScore

  - key: matching.skill_score
    name: 服务能力维度得分
    scope: 候选陪诊员在订单科室上的历史服务能力
    period: 单次匹配（数据来自历史累计）
    source: companion_order(companion_id, department, status)
    formula: "该陪诊员在该科室的已完成单数 / 满量程 × 100，满量程 nianglin.matching.skill-max-orders（默认 20 单），上限 100"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: skillScore

  - key: matching.rating_score
    name: 评分维度得分
    scope: 候选陪诊员的平均评分归一化后的得分
    period: 单次匹配（数据来自历史累计）
    source: companion_profile(score, user_id)
    formula: "score / 5 × 100；无有效评分时记 0 并降级标注"
    caliberVersion: 1
    endpoints:
      - "GET /api/order/{id}/recommend-companions"
    bindings:
      - vo: CompanionMatchVO
        field: ratingScore

  # ==================== 平台运营驾驶舱（V3.5） ====================
  # 区间口径：统计区间默认 30 天、最多 366 天、闭区间；
  # ⚠️ 订单类指标一律按 companion_order.create_time 过滤（与 M10 统计模块同一时间字段）；
  #    ⚠️ 「履约率」与「完成率（按时）」是两个指标，不是同一个数挂两个名字（tickets 偏差 D-3.5-1）。
  - key: operations.today_order_count
    name: 今日订单数
    scope: 平台今日新增的陪诊订单数（不随统计区间浮动）
    period: 当天（按 create_time 精确匹配；「今日」边界由应用侧按本地时区计算，不依赖数据库时区）
    source: companion_order(create_time, deleted)
    formula: "COUNT(create_time >= 今日零点 AND create_time < 次日零点)"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/overview"
    bindings:
      - vo: OperationsOverviewVO
        field: todayOrderCount

  - key: operations.completed_order_count
    name: 区间完成订单数
    scope: 统计区间内创建的陪诊订单中，当前状态为「已完成」的订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, create_time)
    formula: "COUNT(status IN ('COMPLETED','REVIEWED'))"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/overview"
    bindings:
      - vo: OperationsOverviewVO
        field: completedOrderCount

  - key: operations.in_service_count
    name: 区间服务中订单数
    scope: 统计区间内创建的陪诊订单中，当前状态为「服务中」的订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, create_time)
    formula: "COUNT(status = 'IN_SERVICE')"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/overview"
    bindings:
      - vo: OperationsOverviewVO
        field: inServiceCount

  - key: operations.pending_count
    name: 区间待接单订单数
    scope: 统计区间内创建的陪诊订单中，当前状态为「待接单」的订单数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, create_time)
    formula: "COUNT(status = 'PENDING')"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/overview"
    bindings:
      - vo: OperationsOverviewVO
        field: pendingCount

  - key: operations.fulfillment_rate
    name: 履约率
    scope: 统计区间内最终履约（完成）的订单占「完成 + 取消」的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, create_time)
    formula: "(COMPLETED + REVIEWED) / (COMPLETED + REVIEWED + CANCELLED)；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/overview"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsOverviewVO
        field: fulfillmentRate
      - vo: OperationsHealthVO
        field: fulfillmentRate

  - key: operations.completion_rate
    name: 完成率（按时）
    scope: 已完成订单里「没有超时」的比例；与履约率是两个不同指标
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, visit_time, finish_time, create_time)
    formula: "按时完成单数 / 已完成单数；按时 = finish_time <= visit_time + nianglin.operations.fulfillment-window-minutes（默认 240 分钟）；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsHealthVO
        field: completionRate

  - key: operations.avg_accept_minutes
    name: 平均接单时间
    scope: 统计区间内已接单订单从下单到接单的耗时均值
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(create_time, accept_time)
    formula: "AVG(TIMESTAMPDIFF(MINUTE, create_time, accept_time))，仅 accept_time 非空；无已接单订单时记 0"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/overview"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsOverviewVO
        field: avgAcceptMinutes
      - vo: OperationsHealthVO
        field: avgAcceptMinutes

  - key: operations.complaint_rate
    name: 投诉率
    scope: 统计区间内被投诉的订单占区间订单总数的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: complaint(order_id, create_time) + companion_order(create_time)
    formula: "投诉订单数 / 区间订单数；投诉订单数 = COUNT(DISTINCT complaint.order_id)（同一单多次投诉只算一单）；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/overview"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsOverviewVO
        field: complaintRate
      - vo: OperationsHealthVO
        field: complaintRate

  - key: operations.average_score
    name: 平均评分
    scope: 统计区间内有效评价的平均分
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: order_review(score, is_valid, create_time)
    formula: "AVG(score)，仅 is_valid = 1；无有效评价时记 0.00"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/overview"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsOverviewVO
        field: averageScore
      - vo: OperationsHealthVO
        field: averageScore

  - key: operations.active_companion_count
    name: 活跃陪诊员数
    scope: 统计区间内接过单的陪诊员人数（去重）；与 operations.companion_count 同口径同实现（决策 6.2）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, create_time)
    formula: "COUNT(DISTINCT companion_id)，companion_id 非空"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"
      - "GET /api/admin/operations/health"
    bindings:
      - vo: OperationsHealthVO
        field: activeCompanionCount

  - key: operations.exception_manual_required_count
    name: 需人工介入订单数
    scope: 异常中心第一项：履约风险已达人工介入阈值的待接单订单数
    period: 当前状态（不随统计区间浮动）
    source: companion_order(fulfillment_risk, status)
    formula: "<b>复用 V3.1 的判定结果</b>：AdminService#fulfillmentSummary 的 manualRequired（fulfillment_risk = 'MANUAL_REQUIRED' 且 status = 'PENDING'），不另建一套风险判定"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/exceptions"
    bindings:
      - vo: OperationsExceptionItemVO
        field: count

  - key: operations.exception_match_warning_count
    name: 超匹配预警时间订单数
    scope: 异常中心第二项：等待时间超过预警阈值、仍在扩大匹配范围的待接单订单数
    period: 当前状态（不随统计区间浮动）
    source: companion_order(fulfillment_risk, status)
    formula: "<b>复用 V3.1 的判定结果</b>：AdminService#fulfillmentSummary 的 warning + urgent（fulfillment_risk IN ('WARNING','URGENT') 且 status = 'PENDING'），不另建一套风险判定"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/exceptions"
    bindings:
      - vo: OperationsExceptionItemVO
        field: count

  - key: operations.exception_complaint_rate_count
    name: 投诉率异常陪诊员数
    scope: 异常中心第三项：回溯期内投诉率超过阈值的陪诊员人数
    period: 回溯期（默认 30 天，由 nianglin.operations.complaint-lookback-days 配置）
    source: complaint(target_user_id, target_role, create_time) + companion_order(companion_id, create_time)
    formula: "COUNT(陪诊员 WHERE 接单量 >= nianglin.operations.complaint-min-orders（默认 3）AND 投诉订单数 / 接单数 > nianglin.operations.complaint-rate-threshold（默认 0.20）)"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/exceptions"
    bindings:
      - vo: OperationsExceptionItemVO
        field: count

  - key: operations.exception_medication_missed_count
    name: 用药漏服异常数
    scope: 异常中心第四项：统计区间内的漏服服药任务数
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(status, was_missed, plan_time)
    formula: "COUNT(bucket = 'MISSED')，bucket 由 MedicationBucketSql.CASE_BUCKET 唯一裁定（status = 'MISSED' 或 was_missed = 1），与服药日历同源"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/exceptions"
    bindings:
      - vo: OperationsExceptionItemVO
        field: count

  - key: operations.trend.series_value
    name: 趋势序列值
    scope: 平台运营驾驶舱在统计区间内按天分桶的指标序列
    period: 统计区间（默认 30 天、最多 366 天、闭区间；固定 DAY 粒度）
    source: companion_order(create_time, status, companion_id) + complaint(create_time) + order_review(create_time) + medication_task(plan_time)
    formula: "按 dimension 取值：ORDER=当日订单数 / COMPANION_ACTIVE=当日活跃陪诊员数 / FULFILLMENT_RATE=当日履约率(%) / COMPLAINT=当日投诉订单数 / REVIEW=当日评价条数 / MEDICATION=当日用药任务数；无数据的桶补 0"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/trend"
    bindings:
      - vo: OperationsTrendVO$Series
        field: data

  # ==================== 供给缺口与干预效果（V3.6） ====================
  # 本段指标只出现在「供给缺口分析」与「干预效果对比」两个端点上：
  # 前者是时段分桶的供给/需求对照，后者是同一指标在两期区间上的对比。
  - key: operations.gap.pending_unaccepted_count
    name: 时段待接未接单数
    scope: 统计区间内仍处于待接单的陪诊订单数，按周内第几天与小时分桶
    period: 统计区间（默认 30 天、最多 366 天、闭区间）；桶固定 7×24 = 168 个，与区间长度无关
    source: companion_order(status, visit_time)
    formula: "COUNT(status = 'PENDING')，按 visit_time 的 ISO 周内序号（1=周一…7=周日）与小时落桶"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/gap"
    bindings:
      - vo: OperationsGapVO$Item
        field: pendingUnaccepted

  - key: operations.gap.available_companion_count
    name: 时段可服务陪诊员数
    scope: 该时段可服务的陪诊员人数（去重）：优先读结构化表 companion_available_slot，表里没有时回退解析存量自由文本 companion_profile.available_time
    period: 当前可服务时段（按周模板统计，不随统计区间浮动）
    source: companion_available_slot(companion_id, weekday, start_time, end_time) + companion_profile(user_id, available_time)
    formula: "同一陪诊员在同一桶内只计 1 次（按人计，不按单计）；整点落在时段内即算该小时可服务；完全解析不出时段的陪诊员不进任何桶（见 operations.gap.companions_without_slots）"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/gap"
    bindings:
      - vo: OperationsGapVO$Item
        field: availableCompanions

  - key: operations.gap.supply_gap
    name: 时段供给缺口
    scope: 该时段的待接未接单数减去可服务陪诊员数；大于 0 即为缺口
    period: 同 operations.gap.pending_unaccepted_count
    source: companion_order + companion_available_slot
    formula: "pendingUnaccepted − availableCompanions（可为负：供给多于待接量，不做截断）"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/gap"
    bindings:
      - vo: OperationsGapVO$Item
        field: gap

  - key: operations.gap.companions_without_slots
    name: 无可解析可服务时段的陪诊员数
    scope: 全部陪诊员中既没有结构化可服务时段、又无法从自由文本解析出时段的人数；这部分陪诊员不参与供给统计
    period: 当前状态（不随统计区间浮动）
    source: companion_profile(user_id, available_time) + companion_available_slot(companion_id)
    formula: "COUNT(陪诊员 WHERE 结构化时段为空 AND 自由文本解析结果为空)"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/gap"
    bindings:
      - vo: OperationsGapVO
        field: companionsWithoutSlots

  - key: operations.timeout_rate
    name: 超时率
    scope: 已完成订单中未在承诺时长内完成的单数占已完成单数的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, visit_time, finish_time, create_time)
    formula: "(已完成单数 − 按时完成单数) / 已完成单数；按时 = finish_time <= visit_time + nianglin.operations.fulfillment-window-minutes（默认 240 分钟）；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.manual_intervention_rate
    name: 人工介入率
    scope: 统计区间内订单中履约风险已达需人工介入的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(fulfillment_risk, create_time)
    formula: "COUNT(fulfillment_risk = 'MANUAL_REQUIRED') / 区间订单数；判定沿用 V3.1 的履约风险分级，不另建一套；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.reassign_rate
    name: 改派率
    scope: 统计区间内被管理员改派的订单占区间订单总数的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: admin_oper_log(oper_type, target_id, create_time) + companion_order(create_time)
    formula: "COUNT(DISTINCT admin_oper_log.target_id WHERE oper_type = 'REASSIGN_ORDER') / 区间订单数；同一单被改派多次只算一单；注意分子按操作日志时间过滤、分母按下单时间过滤（订单表里没有被改派过的痕迹）；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.service_duration_minutes
    name: 平均服务时长（分钟）
    scope: 统计区间内已完成订单的服务时长均值
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(status, start_time, finish_time, create_time)
    formula: "AVG(TIMESTAMPDIFF(MINUTE, start_time, finish_time))，仅 COMPLETED + REVIEWED 且起止时间均非空；无数据时记 0.00"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.companion_count
    name: 区间陪诊员数
    scope: 统计区间内服务过订单的陪诊员人数（去重）；与 operations.active_companion_count 同口径同实现（决策 6.2）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: companion_order(companion_id, create_time)
    formula: "COUNT(DISTINCT companion_id)，companion_id 非空"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.medication_task_count
    name: 区间用药任务数
    scope: 统计区间内的服药任务总数（漏服率的分母）
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(plan_time, status, was_missed)
    formula: "COUNT(*)，三桶判定与 MedicationBucketSql.CASE_BUCKET 同源（ADR-0014）"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

  - key: operations.medication_missed_rate
    name: 漏服率
    scope: 统计区间内漏服任务占用药任务总数的比例
    period: 统计区间（默认 30 天、最多 366 天、闭区间）
    source: medication_task(plan_time, status, was_missed)
    formula: "漏服桶数 / 任务总数；漏服桶由 MedicationBucketSql.CASE_BUCKET 唯一裁定（status = 'MISSED' 或 was_missed = 1），与服药日历同源；分母为 0 时记 0.00%"
    caliberVersion: 1
    endpoints:
      - "GET /api/admin/operations/effect"

