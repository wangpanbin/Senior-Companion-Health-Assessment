# ==========================================================================
# 银龄伴诊 —— 主配置（所有环境共享）
# 环境差异放在 application-dev.yml / application-prod.yml
# ==========================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: nianglin
  profiles:
    active: dev
  jackson:
    # ⚠️ date-format 只作用于旧的 java.util.Date，对 LocalDateTime / LocalDate **无效**。
    #    本项目实体统一用 LocalDateTime，其输出格式由 config/JacksonConfig.java 显式注册，
    #    改了那边才是真正改口径（行为由 JacksonDateTimeFormatTest 锁定）。此行的作用是
    #    万一将来引入了 java.util.Date 字段时保持一致，别删。
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 值为 null 的字段整体不出现在响应里（前端按「字段不存在」判断，如 rejectReason）
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

# ==========================================================================
# MyBatis-Plus
# ==========================================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.company.nianglin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==========================================================================
# 接口文档 Knife4j / OpenAPI 3
#   - dev 环境可访问；prod 环境由 application-prod.yml 关闭
# ==========================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型
    enable-version: true
    enable-open-api: false
    enable-group: true

# ==========================================================================
# 业务自定义配置
# ==========================================================================
nianglin:
  # JWT（M2 实现；生产环境必须用环境变量覆盖 secret）
  jwt:
    secret: ${JWT_SECRET:nianglin-dev-secret-key-please-change-in-production-0123456789}
    # access token 有效期（分钟）
    expire-minutes: 120
    # refresh token 有效期（天）
    refresh-expire-days: 7
    header: Authorization
    prefix: "Bearer "
  # 订单状态机与业务阈值
  order:
    # 陪诊员接单后多长时间内未开始服务则自动取消（分钟）
    auto-cancel-minutes: 60
    # 打卡坐标允许偏离订单地址的最大距离（米），用于防虚假打卡
    checkin-max-distance-meters: 2000
  # 附件存储（打卡照片 / 投诉证据 / 资质证件 / 头像）
  file:
    # 落盘根目录；对外通过 /uploads/** 暴露，映射见 WebMvcConfig#addResourceHandlers
    # ⚠️ 生产环境务必指到独立数据盘，不要放在应用部署目录里（重新部署会连文件一起清掉）
    upload-dir: ${UPLOAD_DIR:./uploads}
  # 用药管理（M6）
  medication:
    # 定时任务总开关。关掉后两个 @Scheduled 方法都不会被注册，
    # 便于压测 / 故障排查时不希望后台任务干扰业务
    scheduler-enabled: true
    # 每日生成服药任务的时刻（Spring 的 cron 支持 Quartz 风格的 ?）
    daily-generate-cron: "0 0 7 * * ?"
    # 漏服扫描间隔（毫秒），默认 30 分钟
    missed-scan-interval-ms: 1800000
    # 漏服扫描的首次延迟（毫秒）。给一个非 0 的初始延迟，
    # 避免应用刚启动（还在跑 Flyway / 预热）时就立刻打一轮全表扫描
    missed-scan-initial-delay-ms: 300000
    # 超过服药时间多少分钟后判定为漏服
    missed-threshold-minutes: 60
    # 单轮漏服扫描最多处理多少条，防止积压时一次拉爆内存
    miss-scan-batch: 200
    # 服药日历允许查询的最大天数
    max-calendar-days: 31
  # 安全策略
  security:
    # 登录失败几次后锁定（分钟）
    login-fail-threshold: 5
    login-lock-minutes: 15
    # 验证码有效期（秒）
    captcha-expire-seconds: 300
    # 身份证号等 PII 字段的 AES 加密密钥（任意长度，内部 SHA-256 派生为 AES-256）
    # ⚠️ 生产环境必须用环境变量覆盖；一旦更换密钥，已落库的密文将无法解密
    id-card-key: ${ID_CARD_AES_KEY:nianglin-dev-id-card-key-please-change-in-production}
