# ==========================================================================
# 银龄伴诊 —— 主配置（所有环境共享）
# 环境差异放在 application-dev.yml / application-prod.yml
# ==========================================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: nianglin
  profiles:
    # ⚠️ 刻意**不给默认值**：留 `dev` 兜底会让漏配的生产直接以开发配置启动
    #    （SQL 明文日志 + 接口文档全开 + 开发默认密钥生效，三条高危同时落地）。
    #    任何环境都必须显式指定 —— 生产用 SPRING_PROFILES_ACTIVE=prod，
    #    本机开发由 application-dev.yml 提供兜底，不含"凭空默认 dev"。
    active: ${SPRING_PROFILES_ACTIVE:}
  jackson:
    # ⚠️ date-format 只作用于旧的 java.util.Date，对 LocalDateTime / LocalDate **无效**。
    #    本项目实体统一用 LocalDateTime，其输出格式由 config/JacksonConfig.java 显式注册，
    #    改了那边才是真正改口径（行为由 JacksonDateTimeFormatTest 锁定）。此行的作用是
    #    万一将来引入了 java.util.Date 字段时保持一致，别删。
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 值为 null 的字段整体不出现在响应里（前端按「字段不存在」判断，如 rejectReason）
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # M13（ADR-0011）：全局提到 50MB 服务聊天媒体；非 CHAT 业务的 10MB 防线
      # 由 FileStorageServiceImpl#checkSizeLimit 按.bizType 分级守住。
      # request 上限必须大于 file 上限（multipart 含表单开销），否则大文件必然超限。
      max-file-size: 50MB
      max-request-size: 52MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

# ==========================================================================
# MyBatis-Plus
# ==========================================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.company.nianglin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==========================================================================
# 接口文档 Knife4j / OpenAPI 3
#   - dev 环境可访问；prod 环境由 application-prod.yml 关闭
# ==========================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型
    enable-version: true
    enable-open-api: false
    enable-group: true

# ==========================================================================
# 业务自定义配置
# ==========================================================================
nianglin:
  # JWT（M2 实现）。签名密钥一律由环境变量 JWT_SECRET 注入，缺失即启动失败；
  # 开发环境的兜底值只在 application-dev.yml 里给，绝不出现在共享配置中。
  jwt:
    secret: ${JWT_SECRET}
    # access token 有效期（分钟）
    expire-minutes: 120
    # refresh token 有效期（天）
    refresh-expire-days: 7
    header: Authorization
    prefix: "Bearer "
  # 订单状态机与业务阈值
  order:
    # 陪诊员接单后多长时间内未开始服务则自动取消（分钟）
    auto-cancel-minutes: 60
    # 打卡坐标允许偏离订单地址的最大距离（米），用于防虚假打卡
    checkin-max-distance-meters: 2000
  # 履约保障（V3.1 · T1）
  # 风险等级由「订单已等待多少分钟」判定，判定逻辑在 FulfillmentRiskEvaluator（纯函数）。
  # ⚠️ 三个阈值必须严格递增，否则应用启动失败（FulfillmentRiskEvaluator#validateThresholds）；
  #    这是刻意的：反向配置（如 紧急 10 / 预警 30）会表现为「先紧急后预警」。
  #    没人能解释，且要等到事故现场才发现。
  # 阈值已于 2026-10-17 由产品确认：预警线 10 分钟（URGENT 30 / MANUAL_REQUIRED 120 同步沿用）。
  fulfillment:
    # 等待达到该分钟数升为 WARNING（等待时间较长，系统正在扩大匹配范围）
    warning-minutes: 10
    # 升为 URGENT（履约风险较高，此时开放家属催单）
    urgent-minutes: 30
    # 升为 MANUAL_REQUIRED（需管理员人工介入，出现在履约风险中心红区）
    manual-required-minutes: 120
    # 家属两次催单之间的最小间隔（分钟），防止把陪诊员刷到关接单
    urge-cooldown-minutes: 10
    # 单笔订单允许的催单次数上限
    urge-max-times: 3
    # 风险扫描任务总开关；关掉后 @Scheduled 方法不注册（压测 / 排查时用）
    scheduler-enabled: true
    # 单轮扫描的候选订单上限；超出部分留给下一轮，避免一轮跑太久超过锁 TTL。
    # ⚠️ 这个上限刻意绕开分页插件（走 selectList + last("LIMIT n)") 而非 selectPage），
    #    因为 maxLimit 写死 100，走 selectPage 会被静默截断、配置失效。
    scan-batch: 200
    # 扫描间隔（毫秒），默认 5 分钟
    scheduler-interval-ms: 300000
    # 首次扫描前的延迟（毫秒），避开应用启动瞬间的数据库冷启动高峰
    scheduler-initial-delay-ms: 60000
    # 订单大厅默认排序。V3.1 只实现 RECOMMEND（时间临近 + 同服务区域优先）；
    # 传其它值一律 400 而不是静默降级 —— 加权规则引擎在 V3.4 才开放。
    hall-default-sort: RECOMMEND

  # 智能调度（V3.4 · T3）—— 匹配规则引擎的权重与量程
  #
  # ⚠️ 五个权重之和必须等于 1，否则应用启动失败（MatchingProperties#validate）。
  #    错误的权重不会报错，只会让排序悄悄变得不合理 —— 那是最难定位的一类故障，
  #    所以让它在启动的十秒内就暴露，而不是等运营抱怨「推荐不准」。
  matching:
    # 区域匹配权重：区域码相等 1.0 / 同市不同区 0.5 / 跨市 0
    region-weight: 0.30
    # 时间匹配权重：就诊时间落在可服务时段内 1.0 / 同日不同时段 0.5 / 其它 0
    time-weight: 0.25
    # 距离权重：Haversine 距离 / 满量程；陪诊员无坐标时该维度记 0 且不推断
    distance-weight: 0.20
    # 服务能力权重：该陪诊员在该科室的已完成单数 / 满量程
    skill-weight: 0.15
    # 评分权重：陪诊员平均评分 / 5
    rating-weight: 0.10
    # 距离归一化的满量程（米）：距离达到该值时得分归 0
    distance-max-meters: 30000
    # 服务能力归一化的满量程（单）：该科室完成数达到该值时得分归 1
    skill-max-orders: 20
    # 大厅候选集上限（超出时记 warn 日志，不静默截断）
    hall-candidate-limit: 500
    # 候选推荐端点的默认 / 最大返回条数
    recommend-limit: 10
    recommend-max-limit: 20
    # 档期冲突判定的时间窗（分钟）：一次陪诊从就诊到结束约 2–3 小时
    conflict-window-minutes: 180
  # 家属智能助手（V3.7 · M14）—— 门面配置
  #
  # ⚠️ 这段配置全部在启动期校验（AssistantProperties#validate），不合法即启动失败。
  #    理由同 matching：这些值配错都不会报错，只会让助手「安静地不好用」
  #    （超时太短 → 长回答随机失败；限流阈值配成 0 → 助手对所有人不可用）。
  assistant:
    # 助手总开关；关掉后端点直接返回 10002
    enabled: true
    # Python 助手服务地址；该服务只监听 127.0.0.1，不直接对浏览器开放
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8081}
    # 连接超时（毫秒）
    connect-timeout-ms: 3000
    # 读超时（毫秒）：LLM 长回答可能需要十几秒，比默认宽松
    read-timeout-ms: 60000
    # 每用户每分钟允许的提问次数（成本保护，不是安全边界）
    rate-limit-per-minute: 10
    # 允许携带的历史**消息条数**上限（1 轮 = user 1 条 + assistant 1 条 = 2 条；
    # 12 条 = 6 轮）。⚠️ 单位是「条」不是「轮」—— 按「轮」写而实际按「条」卡，
    # 用户问到第 5 轮就会被拦成 400。
    max-history-messages: 12
    # 单条问题的长度上限
    max-question-length: 500
    # Python 不可用时是否走本地 FAQ 兜底
    fallback-on-error: true
    # 兜底用的知识库路径（与 Python 服务读同一个文件，保证两边口径一致）
    # 相对路径按后端进程的工作目录解析（本项目为 backend/）
    faq-path: ../ai-service/knowledge/faq.json
  # 平台运营驾驶舱（V3.5 · T1）
  #
  # ⚠️ 阈值类配置一律在启动期校验（OperationsProperties#validate），
  #    不合法即启动失败：错误的阈值不会报错，只会让看板安静地给出错误结论。
  operations:
    # 「按时完成」的判定窗口（分钟）：finish_time ≤ visit_time + 窗口。
    # ⚠️ 它决定的是「完成率（按时）」，与「履约率」不是同一个指标（tickets 偏差 D-3.5-1）。
    fulfillment-window-minutes: 240
    # 投诉率异常阈值（0-1）：陪诊员投诉率严格大于该值才算异常
    complaint-rate-threshold: 0.20
    # 投诉率统计的回溯天数（异常中心专用，与概览的统计区间无关）
    complaint-lookback-days: 30
    # 计算投诉率时的最小接单量：接单量小于该值不参与判定（样本太小没有意义）
    complaint-min-orders: 3
    # 用药漏服异常的阈值（漏服任务数）
    medication-missed-threshold: 5
    # 趋势区间上限（天）
    trend-max-days: 366
  # 评价（E4 评价公信力闭环）
  review:
    # 评价提交后多少日内可发起 REVIEW_APPEAL 申诉；超时由 Service 层返回 409。
    # 改这里需要同步更新 docs/spec/E4-review-credibility.md §4.7 的注释。
    appeal-deadline-days: 15
  # 附件存储（打卡照片 / 投诉证据 / 资质证件 / 头像）
  file:
    # 落盘根目录；对外通过 /uploads/** 暴露，映射见 WebMvcConfig#addResourceHandlers
    # ⚠️ 生产环境务必指到独立数据盘，不要放在应用部署目录里（重新部署会连文件一起清掉）
    upload-dir: ${UPLOAD_DIR:./uploads}
  # 用药管理（M6）
  medication:
    # 定时任务总开关。关掉后两个 @Scheduled 方法都不会被注册，
    # 便于压测 / 故障排查时不希望后台任务干扰业务
    scheduler-enabled: true
    # 每日生成服药任务的时刻（Spring 的 cron 支持 Quartz 风格的 ?）
    daily-generate-cron: "0 0 7 * * ?"
    # 漏服扫描间隔（毫秒），默认 30 分钟
    missed-scan-interval-ms: 1800000
    # 漏服扫描的首次延迟（毫秒）。给一个非 0 的初始延迟，
    # 避免应用刚启动（还在跑 Flyway / 预热）时就立刻打一轮全表扫描
    missed-scan-initial-delay-ms: 300000
    # 超过服药时间多少分钟后判定为漏服
    missed-threshold-minutes: 60
    # 单轮漏服扫描最多处理多少条，防止积压时一次拉爆内存
    miss-scan-batch: 200
    # 服药日历允许查询的最大天数
    max-calendar-days: 31
  # 安全策略
  security:
    # 登录失败几次后锁定（分钟）
    login-fail-threshold: 5
    login-lock-minutes: 15
    # 验证码有效期（秒）
    captcha-expire-seconds: 300
    # 身份证号等 PII 字段的 AES 加密密钥（任意长度，内部 SHA-256 派生为 AES-256）
    # ⚠️ 一律由环境变量 ID_CARD_AES_KEY 注入，缺失即启动失败；开发兜底值只在 application-dev.yml。
    #    一旦更换密钥，已落库的密文将无法解密 —— 换密钥必须配套数据迁移脚本。
    id-card-key: ${ID_CARD_AES_KEY}
    # 管理员「重置密码」后置入的默认口令；一律由环境变量 DEFAULT_RESET_PASSWORD 注入。
    # 不再在源码里留硬编码兜底（历史上 `Nl@123456` 会随代码分发到生产）。
    default-password: ${DEFAULT_RESET_PASSWORD}
